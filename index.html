<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Artes para Botons</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f3f4f6;color:#222}
header{background:#1f2937;color:#fff;padding:14px 20px}
header h1{margin:0;font-size:20px}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:850px){main{grid-template-columns:1fr}}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
.card h2{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;margin:8px 0 3px}
select,input[type=number]{width:100%;padding:6px;border:1px solid #ccc;border-radius:6px}
input[type=range]{width:100%}
button{background:#2563eb;color:#fff;border:0;padding:9px 14px;border-radius:6px;cursor:pointer;font-size:14px;margin-top:10px}
button.sec{background:#6b7280}button.del{background:#dc2626;padding:4px 8px;margin:0}
#prev{width:100%;max-width:420px;aspect-ratio:1;display:block;margin:10px auto;background:#e5e7eb;border-radius:50%;cursor:grab;touch-action:none}
.hint{font-size:12px;color:#666}
.item{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:6px 0;font-size:13px}
.item img{width:48px;height:48px;border-radius:50%;border:1px solid #ccc}
.item input{width:60px}
.item span{flex:1}
#pages canvas{width:100%;max-width:520px;display:block;margin:0 auto 14px;background:#fff;box-shadow:0 1px 6px #0004}
.row{display:flex;gap:8px}.row>*{flex:1}
button,select,input[type=number]{min-height:40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.bar button{margin:0}
#status{font-size:12px;color:#059669}
@media(max-width:600px){main{padding:8px;gap:8px}.item{flex-wrap:wrap}.item span{flex:1 1 100%}.card{padding:10px}header h1{font-size:17px}}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}header,.side,.noprint{display:none!important}
 main{display:block;padding:0;max-width:none}.card{box-shadow:none;padding:0;margin:0}
 #pages canvas{width:210mm;height:297mm;max-width:none;margin:0;box-shadow:none;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<header><h1>🔘 Gerador de Artes para Botons</h1></header>
<main>
<div class="side">
 <div class="card">
  <h2>1. Foto e tamanho</h2>
  <input type="file" id="file" accept="image/*">
  <label>Tamanho do botton</label>
  <select id="size"><option value="25">25 mm</option><option value="32" selected>32 mm</option><option value="44">44 mm</option><option value="58">58 mm</option></select>
  <label>Diâmetro total da arte (mm) – inclui sangria/dobra</label>
  <input type="number" id="total" step="0.5">
  <p class="hint">Padrão: tamanho + margem para dobrar no verso. Ajuste conforme a sua máquina/prensa.</p>
  <canvas id="prev" width="600" height="600"></canvas>
  <p class="hint">Arraste a foto para posicionar. Linha tracejada = área visível do botton.</p>
  <label>Zoom</label><input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
  <button id="add">+ Adicionar à folha</button>
 </div>
</div>
<div>
 <div class="card">
  <h2>2. Botons criados</h2>
  <div class="bar noprint">
   <button class="sec" id="exp">💾 Exportar projeto</button>
   <button class="sec" id="imp">📂 Importar projeto</button>
   <button class="del" id="clr" style="padding:9px 14px">Limpar tudo</button>
   <span id="status"></span>
   <input type="file" id="impf" accept=".json,application/json" hidden>
  </div>
  <div id="list"><p class="hint">Nenhum botton ainda.</p></div>
 </div>
 <div class="card">
  <h2>3. Folhas A4</h2>
  <div class="noprint">
   <div class="row">
    <div><label>Margem (mm)</label><input type="number" id="margin" value="8" min="0"></div>
    <div><label>Espaço entre botons (mm)</label><input type="number" id="gap" value="2" min="0" step="0.5"></div>
   </div>
   <label><input type="checkbox" id="guides" checked> Mostrar linhas de corte e área visível</label>
   <p id="info" class="hint"></p>
   <button id="pdf">📄 Baixar PDF (A4)</button>
   <button class="sec" id="print">🖨️ Imprimir</button>
   <button class="sec" id="dl">⬇️ Baixar PNG das folhas</button>
  </div>
  <div id="pages" style="margin-top:12px"></div>
 </div>
</div>
</main>
<script>
const DPI=300, mm=v=>Math.round(v/25.4*DPI);
const DEF={25:38,32:45,44:57,58:72};
const $=id=>document.getElementById(id);
let img=null, ox=0, oy=0, items=[];
const prev=$('prev'), pc=prev.getContext('2d');

function setTotal(){$('total').value=DEF[$('size').value]}
setTotal();
$('size').onchange=()=>{setTotal();drawPrev()};
$('total').oninput=drawPrev;
$('zoom').oninput=drawPrev;

$('file').onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const i=new Image();
 i.onload=()=>{img=i;ox=oy=0;$('zoom').value=1;drawPrev()};
 i.src=URL.createObjectURL(f);
};

// desenha a foto num círculo de tamanho S (px); ox/oy são frações de S
function art(ctx,S){
 ctx.save();ctx.beginPath();ctx.arc(S/2,S/2,S/2,0,7);ctx.clip();
 ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);
 if(img){
  const sc=S/Math.min(img.width,img.height)*$('zoom').value;
  const w=img.width*sc,h=img.height*sc;
  ctx.drawImage(img,(S-w)/2+ox*S,(S-h)/2+oy*S,w,h);
 }
 ctx.restore();
}
function drawPrev(){
 const S=prev.width;pc.clearRect(0,0,S,S);art(pc,S);
 const r=$('size').value/$('total').value;
 pc.strokeStyle='#ef4444';pc.lineWidth=3;pc.setLineDash([12,8]);
 pc.beginPath();pc.arc(S/2,S/2,S/2*r,0,7);pc.stroke();pc.setLineDash([]);
}
const ptr=new Map();let pd=0;
prev.onpointerdown=e=>{prev.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});pd=0};
prev.onpointermove=e=>{
 if(!ptr.has(e.pointerId))return;
 const o=ptr.get(e.pointerId),k=prev.getBoundingClientRect().width;
 if(ptr.size===1){ox+=(e.clientX-o.x)/k;oy+=(e.clientY-o.y)/k}
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===2){const [p,q]=[...ptr.values()],d=Math.hypot(p.x-q.x,p.y-q.y);
  if(pd){const z=$('zoom');z.value=Math.min(z.max,Math.max(z.min,z.value*d/pd))}pd=d}
 drawPrev();
};
prev.onpointerup=prev.onpointercancel=e=>{ptr.delete(e.pointerId);pd=0};
prev.addEventListener('wheel',e=>{e.preventDefault();const z=$('zoom');z.value=Math.min(z.max,Math.max(z.min,z.value*(e.deltaY<0?1.05:.95)));drawPrev()},{passive:false});

$('add').onclick=()=>{
 if(!img){alert('Escolha uma foto primeiro.');return}
 const size=+$('size').value,total=+$('total').value,S=mm(total);
 const c=document.createElement('canvas');c.width=c.height=S;art(c.getContext('2d'),S);
 items.push({c,size,total,qty:1,url:c.toDataURL('image/jpeg',.92)});
 renderList();layout();
};

function renderList(){
 const L=$('list');
 if(!items.length){L.innerHTML='<p class="hint">Nenhum botton ainda.</p>';return}
 L.innerHTML='';
 items.forEach((it,i)=>{
  const d=document.createElement('div');d.className='item';
  d.innerHTML=`<img src="${it.url}"><span>${it.size} mm (arte ${it.total} mm)</span>
  <label style="margin:0">Qtd</label><input type="number" min="1" value="${it.qty}">
  <button class="del">✕</button>`;
  d.querySelector('input').oninput=e=>{it.qty=Math.max(1,+e.target.value||1);layout()};
  d.querySelector('button').onclick=()=>{items.splice(i,1);renderList();layout()};
  L.appendChild(d);
 });
}

function layout(){
 const M=+$('margin').value,G=+$('gap').value,W=210,H=297;
 const list=[];items.forEach(it=>{for(let n=0;n<it.qty;n++)list.push(it)});
 list.sort((a,b)=>b.total-a.total);
 const pages=[];let pg=null,x,y,rowH,skipped=0;
 const newPage=()=>{pg=[];pages.push(pg);x=M;y=M;rowH=0};
 for(const it of list){
  const d=it.total;
  if(d>W-2*M||d>H-2*M){skipped++;continue}
  if(!pg)newPage();
  if(x+d>W-M){x=M;y+=rowH+G;rowH=0}
  if(y+d>H-M){newPage()}
  pg.push({it,x,y});x+=d+G;rowH=Math.max(rowH,d);
 }
 const P=$('pages');P.innerHTML='';
 pages.forEach(p=>{
  const c=document.createElement('canvas');c.width=mm(W);c.height=mm(H);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  p.forEach(({it,x,y})=>{
   const px=mm(x),py=mm(y),S=mm(it.total);
   g.drawImage(it.c,px,py,S,S);
   if($('guides').checked){
    g.lineWidth=3;g.strokeStyle='#999';g.beginPath();g.arc(px+S/2,py+S/2,S/2,0,7);g.stroke();
    g.strokeStyle='#ef4444';g.setLineDash([14,10]);g.beginPath();
    g.arc(px+S/2,py+S/2,mm(it.size)/2,0,7);g.stroke();g.setLineDash([]);
   }
  });
  P.appendChild(c);
 });
 save();
 $('info').textContent=list.length?`${list.length} botons em ${pages.length} folha(s) A4`+(skipped?` — ${skipped} não couberam (maiores que a folha)`:''):'Adicione botons para montar as folhas.';
}
['margin','gap','guides'].forEach(i=>$(i).oninput=layout);
$('print').onclick=()=>window.print();
// ---------- PDF A4 (gerado no próprio navegador, sem bibliotecas) ----------
async function makePDF(){
 const pgs=[...document.querySelectorAll('#pages canvas')],N=pgs.length;
 const jp=await Promise.all(pgs.map(c=>new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(x=>r(new Uint8Array(x))),'image/jpeg',.95))));
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
 const o=(n,fn)=>{offs[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n')};
 push('%PDF-1.4\n');
 o(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));
 o(2,()=>push('<</Type/Pages/Kids['+pgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']/Count '+N+'>>'));
 pgs.forEach((c,i)=>{
  const p=3+3*i,ct='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  o(p,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 ${p+2} 0 R>>>>/Contents ${p+1} 0 R>>`));
  o(p+1,()=>push(`<</Length ${ct.length}>>\nstream\n${ct}\nendstream`));
  o(p+2,()=>{push(`<</Type/XObject/Subtype/Image/Width ${c.width}/Height ${c.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jp[i].length}>>\nstream\n`);push(jp[i]);push('\nendstream')});
 });
 const xr=len,tot=3*N+3;
 push(`xref\n0 ${tot}\n0000000000 65535 f \n`);
 for(let n=1;n<tot;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
 push(`trailer\n<</Size ${tot}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
 return new File(parts,'botons-A4.pdf',{type:'application/pdf'});
}
$('pdf').onclick=async()=>{
 if(!document.querySelector('#pages canvas')){alert('Adicione botons primeiro.');return}
 const f=await makePDF();
 if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){
  try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();
};

$('dl').onclick=async()=>{
 const cs=[...document.querySelectorAll('#pages canvas')];
 if(!cs.length)return;
 const files=await Promise.all(cs.map((c,i)=>new Promise(r=>c.toBlob(b=>r(new File([b],`folha-${i+1}.png`,{type:'image/png'}))))));
 if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files})){
  try{await navigator.share({files});return}catch(e){if(e.name==='AbortError')return}
 }
 files.forEach(f=>{const a=document.createElement('a');a.download=f.name;a.href=URL.createObjectURL(f);a.click()});
};

// ---------- salvar / continuar depois ----------
let loaded=false,tm;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('botons',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function dbSet(v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(v,'cur');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function dbGet(){const d=await idb();return new Promise(res=>{const q=d.transaction('p').objectStore('p').get('cur');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
const snap=()=>({v:1,margin:$('margin').value,gap:$('gap').value,guides:$('guides').checked,items:items.map(({size,total,qty,url})=>({size,total,qty,url}))});
function save(){
 if(!loaded)return;clearTimeout(tm);
 tm=setTimeout(async()=>{try{await dbSet(snap());$('status').textContent='✔ Salvo automaticamente neste aparelho'}catch(e){$('status').textContent='⚠ Não foi possível salvar automaticamente — use Exportar projeto'}},400);
}
async function restore(d){
 if(!d||!Array.isArray(d.items))return;
 $('margin').value=d.margin??8;$('gap').value=d.gap??2;$('guides').checked=d.guides!==false;
 items=await Promise.all(d.items.map(it=>new Promise(res=>{
  const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;c.getContext('2d').drawImage(i,0,0);res({c,size:it.size,total:it.total,qty:it.qty||1,url:it.url})};
  i.onerror=()=>res(null);i.src=it.url;
 }))).then(a=>a.filter(Boolean));
 renderList();layout();
}
$('exp').onclick=()=>{
 const b=new Blob([JSON.stringify(snap())],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='projeto-botons.json';a.click();
};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{await restore(JSON.parse(await f.text()))}catch(err){alert('Arquivo de projeto inválido.')}
 e.target.value='';
};
$('clr').onclick=()=>{if(confirm('Apagar todos os botons do projeto?')){items=[];renderList();layout()}};

drawPrev();layout();
dbGet().then(d=>restore(d)).catch(()=>{}).finally(()=>{loaded=true;if(items.length)save()});
</script>
</body>
</html>
